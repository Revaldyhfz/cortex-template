[project]
name = "cortex-reels"
version = "0.2.0"
description = "Local MCP server that lets Claude watch short videos: caption, transcript, frames."
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6.0",
    "mcp[cli]>=2.3.0",
    "yt-dlp>=2026.8.19",
    # NVIDIA GPU acceleration, only where CUDA exists. macOS always runs Whisper on the CPU.
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "nvidia-cudnn-cu12>=9.27.0.42; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[tool.uv]
package = false
# Every platform here must get real wheels, or the lock is rejected. Without this, uv once
# picked an NVIDIA wheel that exists only for Linux and broke the Windows install.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
